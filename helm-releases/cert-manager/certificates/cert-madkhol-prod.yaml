apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: madkhol-traefik-cert-prod
  namespace: madkhol
spec:
  dnsNames:
    - app.madkhol.com
    - api.madkhol.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: acme-http-issuer-traefik
  secretName: madkhol-traefik-cert-prod
